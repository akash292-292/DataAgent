<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://www.forsysinc.com/assets/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="https://www.forsysinc.com/assets/img/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <title>Forsys Agents</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #f8f9fa; /* Clean light background */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Main Centering Container */
      .loader-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        position: fixed; /* Ensures it stays on screen */
        top: 0;
        left: 0;
        z-index: 9999;
        background-color: #f8f9fa;
      }

      /* 1. Robot Icon Style */
      .agent-icon {
        font-size: 80px; /* Big Icon size */
        margin-bottom: 15px;
        animation: float 3s ease-in-out infinite;
        cursor: default;
      }

      /* 2. Title Style */
      .agent-title {
        font-size: 28px;
        font-weight: 700;
        color: #2c3e50; /* Dark Blue-Grey */
        margin-bottom: 25px;
        letter-spacing: 0.5px;
      }

      /* 3. Spinner Style */
      .spinner {
        width: 45px;
        height: 45px;
        border: 4px solid #e0e0e0;
        border-top: 4px solid #007bff; /* Tech Blue Color */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* 4. Subtext Style */
      .loading-text {
        margin-top: 20px;
        color: #6c757d;
        font-size: 14px;
        font-weight: 500;
        animation: pulse 1.5s infinite ease-in-out;
      }

      /* Animations */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); } /* Floating effect */
        100% { transform: translateY(0px); }
      }

      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
    </style>

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root">
      
      <div class="loader-container">
        
        <div class="agent-icon">🤖</div>
        
        <div class="agent-title">Data Agent</div>
        
        <div class="spinner"></div>
        
        <div class="loading-text">Initializing Agent...</div>
        
      </div>

    </div>
    
  </body>
</html>
